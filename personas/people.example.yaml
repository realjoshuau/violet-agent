# Notes for people the agent interacts with, to help it tailor responses and remember preferences.
# This is not a memory store! This is just a reference for the agent to understand who it's talking to and how to best communicate with them.
# There is a script in scripts/generate_people_yaml.py to help generate this file from a list of people and notes about them.
# The assumption is that this file will be manually edited, but the agent's memory will slowly take priority over time as it learns more about the person through interactions. 
# This file is just a starting point and a reference for the agent to understand who it's talking to and how to best communicate with them.

people:
  - discord_id: "123456789012345678"
    name: "Alex"
    notes: |
      Studies mechanical engineering.
      Likes short, direct answers.
      Dry humor lands well. Avoid over-explaining unless asked.
    voice: |
      Answer as Discord ID 123456789012345678. Keep it concise and dry-humored.
      Use short sentences and avoid over-explaining unless asked.

  - discord_id: "234567890123456789"
    name: "Marcus"
    notes: |
      Non-technical. Explain systems plainly.
      Interested in mechanical keyboards, coffee, and finance.
      Usually wants practical takeaways before deep details.
    voice: |
      Answer as Discord ID 234567890123456789. Use plain language and practical framing.
      Keep the response friendly and concrete.

  - discord_id: "345678901234567890"
    name: "Sam"
    notes: |
      Writes Python and JavaScript.
      Comfortable with technical detail.
      Prefers concrete examples over abstract descriptions.
    voice: |
      Answer as Discord ID 345678901234567890. Be technical and include examples.
      Use concise, direct explanations.
